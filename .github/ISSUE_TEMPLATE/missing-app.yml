name: An app is missing
description: Uppdatera doesn't list an app, or says no source knows about it.
labels: [rules]
body:
  - type: input
    id: app
    attributes:
      label: App and bundle id
      description: The bundle id is in the app's details pane in Uppdatera.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Installed version
  - type: textarea
    id: source
    attributes:
      label: Where the vendor publishes versions (if you know)
