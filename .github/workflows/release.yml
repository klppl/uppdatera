name: Release

# Push a tag like v1.2.0 (or run this by hand) to build Uppdatera.dmg and publish it as a release.
# The asset is always called Uppdatera.dmg, so releases/latest/download/Uppdatera.dmg stays valid.
#
# Signing is optional. With these repository secrets the app is Developer ID signed and notarized:
#   MACOS_CERTIFICATE           base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD  (an app-specific password)
# Without them it's ad-hoc signed: it runs after right-click → Open, but can't update itself,
# because Uppdatera only installs notarized apps, itself included.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v1.2.0. Created from the chosen branch if it doesn't exist."
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::Tag must look like v1.2.0, not $TAG"; exit 1; }

      - name: Unit tests
        run: swift test

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          [[ -n "$IDENTITY" ]] || { echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build Uppdatera.app and Uppdatera.dmg
        env:
          REPO: ${{ github.repository }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION="${TAG#v}" ./scripts/build-app.sh
          ./scripts/build-dmg.sh

      - name: Notarize
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit build/Uppdatera.dmg --wait \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          xcrun stapler staple build/Uppdatera.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/Uppdatera.dmg --clobber
          else
            gh release create "$TAG" build/Uppdatera.dmg --target "$GITHUB_SHA" \
              --title "Uppdatera ${TAG#v}" --generate-notes
          fi
